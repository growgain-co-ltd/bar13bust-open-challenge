<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BAR 13 BUST OPEN CHALLENGE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    .progress {
      background: #222;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .challenge {
      background: #1d1d1d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #333;
      transition: 0.15s;
    }

    .challenge.completed {
      border-color: #35d07f;
      background: #16251d;
    }

    .number {
      font-size: 13px;
      color: #999;
      margin-bottom: 5px;
    }

    .title {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #111;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
    }

    .pending {
      color: #ffd54a;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .completed-text {
      color: #35d07f;
      font-weight: bold;
      text-align: center;
      padding: 10px 0;
    }

    .message {
      text-align: center;
      margin: 15px 0;
      color: #aaa;
      min-height: 20px;
    }

    .sync {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin: 5px 0 15px;
      min-height: 18px;
    }

    .clear {
      display: none;
      background: #35d07f;
      color: #07140d;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .startup {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 10px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>BAR 13 BUST</h1>

  <div class="subtitle">
    OPEN CHALLENGE
  </div>


  <div id="app">

    <div
      id="progress"
      class="progress"
    >
      0 / 9 達成
    </div>


    <div
      id="clear"
      class="clear"
    >
      🎉 9個すべて達成！ 🎉<br><br>
      スタッフに画面を見せてください。
    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div
      id="sync"
      class="sync"
    >
      LINEと接続しています...
    </div>


    <div id="challengeList"></div>


    <div
      id="startup"
      class="startup"
    >
      起動しています...
    </div>

  </div>

</div>


<script>

/*
 * =========================
 * 設定
 * =========================
 */

const LIFF_ID =
  "2011914396-ReXZiMYU";


const API_URL =
  "https://script.google.com/macros/s/AKfycbw-yjQaB3fDoxN4U_D7WMxiAPsrAlT5Urgp8pk8vc-eww2YpMJakiBQNN5l_uI0izA/exec";


const CHALLENGES = [

  "BAR 13 BUSTに来店",

  "公式LINE友だち登録をする",

  "キープボトルを注文（誰かと一緒に入れるもOK）",

  "スタッフと乾杯（スタッフドリンク1杯）",

  "ショットを注文",

  "ダーツを1回プレイ",

  "スタッフの誰かと写真を撮る",

  "BAR 13 BUSTのInstagramをフォロー",

  "InstagramのストーリーでBAR 13 BUSTをメンションする"

];


let lineUserId = "";

let challenges = [...CHALLENGES];

let statuses = [
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  ""
];


/*
 * Apps Script同期完了状態
 */
let syncReady = false;


/*
 * 同期中に押された操作を保存
 */
let queuedActions = [];


/*
 * 現在同期中か
 */
let syncing = false;


/*
 * =========================
 * キャッシュ
 * =========================
 */

function getCacheKey(userId) {

  return (
    "bar13bust_challenge_" +
    userId
  );
}


function saveCache() {

  if (!lineUserId) {
    return;
  }


  try {

    localStorage.setItem(

      getCacheKey(
        lineUserId
      ),

      JSON.stringify({

        challenges:
          challenges,

        statuses:
          statuses,

        savedAt:
          Date.now()

      })

    );

  } catch (error) {

    console.log(
      "キャッシュ保存失敗",
      error
    );
  }
}


function loadCache(userId) {

  try {

    const raw =
      localStorage.getItem(
        getCacheKey(userId)
      );


    if (!raw) {
      return false;
    }


    const data =
      JSON.parse(raw);


    if (
      !data ||
      !Array.isArray(
        data.statuses
      )
    ) {

      return false;
    }


    statuses =
      data.statuses;


    return true;

  } catch (error) {

    console.log(
      "キャッシュ読み込み失敗",
      error
    );


    return false;
  }
}


/*
 * =========================
 * JSONP
 * =========================
 */

function jsonp(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(

          Object.assign(
            {},
            params,
            {
              callback:
                callbackName
            }
          )

        );


      script.src =
        API_URL +
        "?" +
        query.toString();


      let finished =
        false;


      const timer =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                "通信がタイムアウトしました。"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timer);


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );
        }


        delete window[
          callbackName
        ];
      }


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          resolve(data);
        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          reject(
            new Error(
              "サーバーとの通信に失敗しました。"
            )
          );
        };


      document.body.appendChild(
        script
      );

    }
  );
}


/*
 * =========================
 * 画面表示
 * =========================
 */

function render() {

  const list =
    document.getElementById(
      "challengeList"
    );


  list.innerHTML = "";


  let completedCount = 0;


  challenges.forEach(
    function(challenge, index) {

      const status =
        statuses[index] || "";


      if (
        status === "completed"
      ) {

        completedCount++;
      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "challenge" +
        (
          status === "completed"
            ? " completed"
            : ""
        );


      let content = "";


      content +=
        '<div class="number">' +
        "CHALLENGE " +
        (index + 1) +
        "</div>";


      content +=
        '<div class="title">' +
        escapeHtml(
          challenge
        ) +
        "</div>";


      /*
       * 達成済み
       */
      if (
        status === "completed"
      ) {

        content +=
          '<div class="completed-text">' +
          "✓ 達成済み" +
          "</div>";

      }


      /*
       * 確認待ち
       */
      else if (
        status === "pending"
      ) {

        content +=
          '<div class="pending">' +
          "スタッフ確認待ち" +
          "</div>";


        content +=
          '<button ' +
          'onclick="confirmChallenge(' +
          index +
          ')">' +
          "スタッフ：達成済みにする" +
          "</button>";

      }


      /*
       * 未達成
       */
      else {

        content +=
          '<button ' +
          'onclick="requestChallenge(' +
          index +
          ')">' +
          "達成する" +
          "</button>";
      }


      card.innerHTML =
        content;


      list.appendChild(
        card
      );

    }
  );


  document.getElementById(
    "progress"
  ).textContent =
    completedCount +
    " / 9 達成";


  document.getElementById(
    "clear"
  ).style.display =
    completedCount === 9
      ? "block"
      : "none";
}


/*
 * =========================
 * 初期表示
 * =========================
 */

function showInitialScreen() {

  /*
   * LIFFやApps Scriptを待たず、
   * 最初から9項目を表示
   */

  challenges =
    [...CHALLENGES];


  statuses = [
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
  ];


  render();


  document.getElementById(
    "startup"
  ).style.display =
    "none";
}


/*
 * =========================
 * LIFF初期化
 * =========================
 */

async function init() {

  /*
   * まず画面を表示
   *
   * ここでは一切待たない
   */

  showInitialScreen();


  try {

    /*
     * LIFF初期化
     */
    await liff.init({
      liffId:
        LIFF_ID
    });


    /*
     * 外部ブラウザの場合
     */
    if (
      !liff.isLoggedIn()
    ) {

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    /*
     * LINEユーザー情報
     */
    const profile =
      await liff.getProfile();


    lineUserId =
      profile.userId;


    /*
     * LINE取得後、
     * ユーザー専用キャッシュを即表示
     */
    loadCache(
      lineUserId
    );


    render();


    /*
     * ここからApps Script同期
     *
     * 画面表示は待たない
     */
    syncWithServer();


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      "sync"
    ).textContent =
      "LINEとの接続に失敗しました。";

  }
}


/*
 * =========================
 * サーバー同期
 * =========================
 */

async function syncWithServer() {

  if (
    syncing ||
    !lineUserId
  ) {

    return;
  }


  syncing = true;


  document.getElementById(
    "sync"
  ).textContent =
    "最新情報を確認しています...";


  try {

    /*
     * Apps Scriptへ問い合わせ
     */
    const result =
      await jsonp({

        action:
          "get",

        line_user_id:
          lineUserId

      });


    if (
      !result.ok
    ) {

      throw new Error(
        result.error ||
        "データ取得に失敗しました。"
      );
    }


    /*
     * サーバーの最新状態を反映
     */
    challenges =
      result.challenges || [
        ...CHALLENGES
      ];


    statuses =
      result.statuses || [
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        ""
      ];


    /*
     * キャッシュ更新
     */
    saveCache();


    /*
     * 最新状態を表示
     */
    render();


    syncReady =
      true;


    document.getElementById(
      "sync"
    ).textContent =
      "";


    /*
     * 同期中に押された操作を処理
     */
    await processQueuedActions();


  } catch (error) {

    console.error(
      error
    );


    /*
     * 通信失敗でも、
     * 画面はそのまま使用可能
     */
    document.getElementById(
      "sync"
    ).textContent =
      "通信確認中";


  } finally {

    syncing =
      false;
  }
}


/*
 * =========================
 * 同期前の操作処理
 * =========================
 */

async function processQueuedActions() {

  if (
    queuedActions.length === 0
  ) {

    return;
  }


  const actions =
    [...queuedActions];


  queuedActions =
    [];


  for (
    const action of actions
  ) {

    try {

      if (
        action.type ===
        "request"
      ) {

        await sendRequest(
          action.index
        );

      }


      else if (
        action.type ===
        "confirm"
      ) {

        await sendConfirm(
          action.index
        );

      }

    } catch (error) {

      console.error(
        error
      );
    }
  }
}


/*
 * =========================
 * 達成申請
 * =========================
 */

async function requestChallenge(
  index
) {

  const oldStatus =
    statuses[index] || "";


  if (
    oldStatus === "pending" ||
    oldStatus === "completed"
  ) {

    return;
  }


  /*
   * 画面を即変更
   */
  statuses[index] =
    "pending";


  render();


  showMessage(
    "この画面をスタッフに見せてください。"
  );


  saveCache();


  /*
   * LINE情報取得直後で
   * サーバー同期がまだの場合
   */
  if (
    !syncReady
  ) {

    queuedActions.push({
      type: "request",
      index: index
    });


    return;
  }


  /*
   * 通常処理
   */
  try {

    await sendRequest(
      index
    );

  } catch (error) {

    statuses[index] =
      oldStatus;


    saveCache();


    render();


    showMessage(
      "保存に失敗しました。もう一度お試しください。"
    );

  }
}


/*
 * =========================
 * 達成申請をサーバー保存
 * =========================
 */

async function sendRequest(
  index
) {

  const result =
    await jsonp({

      action:
        "request",

      line_user_id:
        lineUserId,

      challenge_index:
        index

    });


  if (
    !result.ok
  ) {

    throw new Error(
      result.error ||
      "保存に失敗しました。"
    );
  }
}


/*
 * =========================
 * スタッフ確認
 * =========================
 */

async function confirmChallenge(
  index
) {

  const ok =
    window.confirm(
      "このチャレンジを達成済みにしますか？"
    );


  if (!ok) {

    return;
  }


  const oldStatus =
    statuses[index];


  /*
   * 即座に画面変更
   */
  statuses[index] =
    "completed";


  render();


  showMessage(
    "達成しました！"
  );


  saveCache();


  /*
   * 同期前ならキューへ
   */
  if (
    !syncReady
  ) {

    queuedActions.push({
      type: "confirm",
      index: index
    });


    return;
  }


  /*
   * 通常処理
   */
  try {

    await sendConfirm(
      index
    );

  } catch (error) {

    statuses[index] =
      oldStatus;


    saveCache();


    render();


    showMessage(
      "保存に失敗しました。もう一度お試しください。"
    );

  }
}


/*
 * =========================
 * スタッフ確認をサーバー保存
 * =========================
 */

async function sendConfirm(
  index
) {

  const result =
    await jsonp({

      action:
        "confirm",

      line_user_id:
        lineUserId,

      challenge_index:
        index

    });


  if (
    !result.ok
  ) {

    throw new Error(
      result.error ||
      "保存に失敗しました。"
    );
  }
}


/*
 * =========================
 * メッセージ
 * =========================
 */

function showMessage(
  message
) {

  document.getElementById(
    "message"
  ).textContent =
    message;
}


/*
 * =========================
 * HTMLエスケープ
 * =========================
 */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/*
 * =========================
 * 起動
 * =========================
 */

init();

</script>

</body>
</html>
