<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BAR 13 BUST LIFF診断</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .status {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #222;
      border: 1px solid #444;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok {
      border-color: #22c55e;
      background: #102818;
    }

    .error {
      border-color: #ef4444;
      background: #301010;
      color: #ffb4b4;
    }

    .waiting {
      border-color: #eab308;
      background: #302900;
      color: #ffe88a;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #06c755;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BAR 13 BUST<br>LIFF診断</h1>

  <div id="step1" class="status waiting">
    ① HTML読み込み中...
  </div>

  <div id="step2" class="status waiting">
    ② LINE SDK読み込み待ち...
  </div>

  <div id="step3" class="status waiting">
    ③ LIFF初期化待ち...
  </div>

  <div id="step4" class="status waiting">
    ④ LINEログイン状態確認待ち...
  </div>

  <div id="step5" class="status waiting">
    ⑤ LINEユーザー情報取得待ち...
  </div>

  <button id="loginButton" style="display:none;">
    LINEログインを開始
  </button>

  <div class="small">
    URL:<br>
    <span id="currentUrl"></span>
  </div>

</div>

<script>

const LIFF_ID = "2011914396-ReXZiMYU";

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");
const step4 = document.getElementById("step4");
const step5 = document.getElementById("step5");
const loginButton = document.getElementById("loginButton");
const currentUrl = document.getElementById("currentUrl");


function setOK(element, message) {
  element.className = "status ok";
  element.textContent = message;
}


function setError(element, message) {
  element.className = "status error";
  element.textContent = message;
}


function setWaiting(element, message) {
  element.className = "status waiting";
  element.textContent = message;
}


currentUrl.textContent = location.href;


/* ---------------------------------
   ① HTML
--------------------------------- */

setOK(
  step1,
  "① HTML読み込み OK"
);


/* ---------------------------------
   ② LINE SDK
--------------------------------- */

if (typeof liff === "undefined") {

  setError(
    step2,
    "② LINE SDK読み込み失敗\n\nliff が見つかりません。\nLINE SDK自体を読み込めていません。"
  );

} else {

  setOK(
    step2,
    "② LINE SDK読み込み OK"
  );

  initializeLIFF();

}


/* ---------------------------------
   ③ LIFF初期化
--------------------------------- */

async function initializeLIFF() {

  try {

    setWaiting(
      step3,
      "③ LIFF初期化中..."
    );

    await liff.init({
      liffId: LIFF_ID
    });

    setOK(
      step3,
      "③ LIFF初期化 OK"
    );


    /* ---------------------------------
       ④ LINEログイン状態
    --------------------------------- */

    try {

      const inClient = liff.isInClient();
      const loggedIn = liff.isLoggedIn();

      setOK(
        step4,
        "④ LINE状態確認 OK\n\n" +
        "LIFF内: " + inClient + "\n" +
        "ログイン済み: " + loggedIn
      );


      /* ---------------------------------
         未ログイン
      --------------------------------- */

      if (!loggedIn) {

        loginButton.style.display = "block";

        setWaiting(
          step5,
          "⑤ LINEユーザー情報\n\n" +
          "まだログインしていません。\n" +
          "下の「LINEログインを開始」を押してください。"
        );

        loginButton.onclick = function() {

          liff.login({
            redirectUri: location.href
          });

        };

        return;
      }


      /* ---------------------------------
         ⑤ ユーザー情報
      --------------------------------- */

      setWaiting(
        step5,
        "⑤ LINEユーザー情報取得中..."
      );


      let userId = null;


      try {

        const idToken = liff.getDecodedIDToken();

        if (idToken && idToken.sub) {
          userId = idToken.sub;
        }

      } catch (e) {

        console.log(
          "getDecodedIDToken error:",
          e
        );

      }


      if (!userId) {

        try {

          const profile = await liff.getProfile();

          if (profile && profile.userId) {
            userId = profile.userId;
          }

        } catch (e) {

          console.log(
            "getProfile error:",
            e
          );

        }

      }


      if (!userId) {

        throw new Error(
          "LINEユーザーIDを取得できませんでした。"
        );

      }


      setOK(
        step5,
        "⑤ LINEユーザー情報取得 OK\n\n" +
        "LINE User ID:\n" +
        userId
      );


    } catch (error) {

      setError(
        step4,
        "④ LINE状態確認エラー\n\n" +
        error.message
      );

    }


  } catch (error) {

    setError(
      step3,
      "③ LIFF初期化失敗\n\n" +
      "エラー:\n" +
      error.message +
      "\n\n" +
      "LIFF ID:\n" +
      LIFF_ID
    );

  }

}

</script>

</body>
</html>
