<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAR 13 BUST OPEN CHALLENGE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:22px 16px 40px}
.wrap{max-width:560px;margin:auto}
h1{text-align:center;font-size:27px;line-height:1.25;margin:12px 0 6px;font-weight:800}
.sub{text-align:center;color:#bbb;margin-bottom:18px}
.count{text-align:center;font-size:36px;font-weight:800;margin:8px 0}
.bar{height:10px;background:#333;border-radius:99px;overflow:hidden;margin:12px 0 22px}
.fill{height:100%;width:0;background:#67e8a9;transition:.25s}
.card{display:flex;align-items:center;gap:12px;background:#242424;border-radius:15px;padding:14px;margin:10px 0}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#3a3a3a;font-weight:800;flex:none}
.body{flex:1}.title{font-size:16px;font-weight:700}.hint{font-size:12px;color:#999;margin-top:4px}
button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:#fff;color:#111}
button.done{background:#67e8a9;color:#111}
button:disabled{opacity:.65}
.clear{display:none;background:#173b2b;border:1px solid #67e8a9;border-radius:15px;padding:18px;text-align:center;margin-top:18px}
.clear strong{font-size:22px}
.note{text-align:center;color:#888;font-size:12px;margin-top:18px}
.error{background:#382323;color:#ff8d8d;border-radius:12px;padding:12px;margin:12px 0;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
<h1>BAR 13 BUST<br>OPEN CHALLENGE</h1>
<div class="sub">9個達成で景品GET！</div>
<div class="count" id="count">0 / 9 CLEAR</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="error" class="error"></div>
<div id="list"></div>
<div id="clear" class="clear"><strong>🎉 CLEAR！</strong><br>9個すべて達成しました！<br>スタッフに画面を見せて景品をGET！</div>
<div class="note">達成した項目はスタッフに確認してもらってください。</div>
</div>

<script>
const LIFF_ID="2011914396-ReXZiMYU";
const FUNCTION_URL="https://hbughgnmpvvuxvwcfmwd.supabase.co/functions/v1/bar13bust-challenge";
const STAFF_PIN="1313";
let lineUserId="";
let challenges=[];
let completed=new Set();

const $=id=>document.getElementById(id);
function showError(msg){$("error").textContent=msg;$("error").style.display="block";}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

async function api(url,options={}){
 const r=await fetch(url,{...options,mode:"cors",cache:"no-store"});
 const text=await r.text();
 let data; try{data=JSON.parse(text)}catch{throw new Error(text||("HTTP "+r.status))}
 if(!r.ok||data.ok===false) throw new Error(data.error||("HTTP "+r.status));
 return data;
}

function render(){
 const done=completed.size;
 $("count").textContent=`${done} / 9 CLEAR`;
 $("fill").style.width=`${Math.min(done,9)/9*100}%`;
 $("list").innerHTML=challenges.map((c,i)=>{
   const isDone=completed.has(Number(c.id));
   return `<div class="card">
     <div class="num">${i+1}</div>
     <div class="body"><div class="title">${esc(c.title)}</div><div class="hint">${isDone?"達成済み":"スタッフ確認後に達成"}</div></div>
     <button class="${isDone?"done":""}" ${isDone?"disabled":""} onclick="completeChallenge(${Number(c.id)})">${isDone?"✓ 達成":"達成する"}</button>
   </div>`;
 }).join("");
 $("clear").style.display=done>=9?"block":"none";
}

async function completeChallenge(id){
 if(completed.has(id))return;
 const pin=prompt("スタッフ確認用PINを入力してください");
 if(pin===null)return;
 if(pin!==STAFF_PIN){alert("PINが違います。");return;}
 try{
   const btns=document.querySelectorAll("button");
   btns.forEach(b=>b.disabled=true);
   await api(FUNCTION_URL,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({line_user_id:lineUserId,challenge_id:id})
   });
   completed.add(id);
   render();
 }catch(e){
   showError("達成登録に失敗しました。\n"+e.message);
   render();
 }
}

window.completeChallenge=completeChallenge;

(async()=>{
 try{
   const s=document.createElement("script");
   s.src="https://static.line-scdn.net/liff/edge/2/sdk.js";
   await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=()=>reject(new Error("LINE SDKを読み込めませんでした"));document.head.appendChild(s)});
   await liff.init({liffId:LIFF_ID});
   if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
   const p=await liff.getProfile();
   lineUserId=p.userId;

   const data=await api(FUNCTION_URL+"?line_user_id="+encodeURIComponent(lineUserId));
   challenges=data.challenges||[];
   completed=new Set((data.completed||[]).map(Number));
   render();
 }catch(e){
   showError("接続エラー\n"+(e.message||String(e)));
 }
})();
</script>
</body>
</html>
