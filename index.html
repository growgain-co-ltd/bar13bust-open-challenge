<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BAR 13 BUST 通信診断</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .status {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #222;
      border: 1px solid #444;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok {
      border-color: #22c55e;
      background: #102818;
    }

    .error {
      border-color: #ef4444;
      background: #301010;
      color: #ffb4b4;
    }

    .waiting {
      border-color: #eab308;
      background: #302900;
      color: #ffe88a;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BAR 13 BUST<br>通信診断</h1>

  <div id="step1" class="status waiting">
    ① LIFF初期化待ち...
  </div>

  <div id="step2" class="status waiting">
    ② LINEユーザー情報取得待ち...
  </div>

  <div id="step3" class="status waiting">
    ③ Supabase接続待ち...
  </div>

  <div id="step4" class="status waiting">
    ④ データ取得待ち...
  </div>

  <div id="result" class="status waiting">
    結果待ち...
  </div>

</div>

<script>

const LIFF_ID = "2011914396-ReXZiMYU";

const FUNCTION_URL =
  "https://hbughgnmpvuvxwcfmwd.supabase.co/functions/v1/bar13bust-challenge";


const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");
const step4 = document.getElementById("step4");
const result = document.getElementById("result");


function setOK(element, message) {
  element.className = "status ok";
  element.textContent = message;
}


function setError(element, message) {
  element.className = "status error";
  element.textContent = message;
}


function setWaiting(element, message) {
  element.className = "status waiting";
  element.textContent = message;
}


async function start() {

  try {

    /* -----------------------------
       ① LIFF
    ----------------------------- */

    setWaiting(
      step1,
      "① LIFF初期化中..."
    );

    await liff.init({
      liffId: LIFF_ID
    });

    setOK(
      step1,
      "① LIFF初期化 OK"
    );


    /* -----------------------------
       ② LINE User ID
    ----------------------------- */

    setWaiting(
      step2,
      "② LINEユーザー情報取得中..."
    );

    let lineUserId = null;


    try {

      const idToken = liff.getDecodedIDToken();

      if (idToken && idToken.sub) {
        lineUserId = idToken.sub;
      }

    } catch (e) {

      console.log(e);

    }


    if (!lineUserId) {

      const profile = await liff.getProfile();

      if (profile && profile.userId) {
        lineUserId = profile.userId;
      }

    }


    if (!lineUserId) {

      throw new Error(
        "LINEユーザーIDを取得できませんでした。"
      );

    }


    setOK(
      step2,
      "② LINEユーザー情報取得 OK\n\n" +
      "LINE User ID:\n" +
      lineUserId
    );


    /* -----------------------------
       ③ Supabase
       ※ apikeyを付けない
    ----------------------------- */

    setWaiting(
      step3,
      "③ Supabase Edge Functionへ接続中...\n\n" +
      "apikeyなしで通信します。"
    );


    const requestUrl =
      FUNCTION_URL +
      "?line_user_id=" +
      encodeURIComponent(lineUserId);


    const response = await fetch(
      requestUrl,
      {
        method: "GET",
        mode: "cors",
        cache: "no-store"
      }
    );


    setOK(
      step3,
      "③ Supabase Edge Function 接続 OK\n\n" +
      "HTTP Status: " +
      response.status
    );


    /* -----------------------------
       ④ データ
    ----------------------------- */

    setWaiting(
      step4,
      "④ Supabaseデータ確認中..."
    );


    const text = await response.text();


    let data;

    try {

      data = JSON.parse(text);

    } catch (e) {

      throw new Error(
        "JSONではないレスポンスが返りました。\n\n" +
        text
      );

    }


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        "\n\n" +
        JSON.stringify(data, null, 2)
      );

    }


    if (
      !data ||
      data.ok !== true ||
      !Array.isArray(data.challenges)
    ) {

      throw new Error(
        "想定したデータが返ってきませんでした。\n\n" +
        JSON.stringify(data, null, 2)
      );

    }


    setOK(
      step4,
      "④ Supabaseデータ取得 OK\n\n" +
      "チャレンジ数: " +
      data.challenges.length
    );


    /* -----------------------------
       成功
    ----------------------------- */

    result.className = "status ok";

    result.textContent =
      "通信テスト成功！\n\n" +
      "LINE → LIFF → Supabase\n" +
      "の通信が正常です。\n\n" +
      "チャレンジ数: " +
      data.challenges.length;


  } catch (error) {

    result.className = "status error";

    result.textContent =
      "通信テスト失敗\n\n" +
      (
        error && error.message
          ? error.message
          : String(error)
      );


    console.error(
      "通信エラー:",
      error
    );

  }

}


start();

</script>

</body>
</html>
