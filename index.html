<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BAR 13 BUST OPEN CHALLENGE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    .progress {
      background: #222;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .challenge {
      background: #1d1d1d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #333;
      transition: 0.15s;
    }

    .challenge.completed {
      border-color: #35d07f;
      background: #16251d;
    }

    .number {
      font-size: 13px;
      color: #999;
      margin-bottom: 5px;
    }

    .title {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #111;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .pending {
      color: #ffd54a;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .completed-text {
      color: #35d07f;
      font-weight: bold;
      text-align: center;
      padding: 10px 0;
    }

    .message {
      text-align: center;
      margin: 15px 0;
      color: #aaa;
      min-height: 20px;
    }

    .clear {
      display: none;
      background: #35d07f;
      color: #07140d;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /*
     * 起動直後に表示する仮画面
     */
    .startup {
      text-align: center;
      padding: 25px 10px 10px;
      color: #aaa;
    }

    .startup-spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #444;
      border-top-color: #fff;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>

</head>


<body>

<div class="container">

  <h1>BAR 13 BUST</h1>

  <div class="subtitle">
    OPEN CHALLENGE
  </div>


  <!--
    起動直後から表示する画面
  -->
  <div id="app">

    <div
      id="progress"
      class="progress"
    >
      0 / 9 達成
    </div>


    <div
      id="clear"
      class="clear"
    >
      🎉 9個すべて達成！ 🎉<br><br>
      スタッフに画面を見せてください。
    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div id="challengeList"></div>


    <div
      id="startup"
      class="startup"
    >
      <div class="startup-spinner"></div>
      <div id="startupText">
        読み込み中...
      </div>
    </div>

  </div>

</div>


<script>

const LIFF_ID =
  "2011914396-ReXZiMYU";


const API_URL =
  "https://script.google.com/macros/s/AKfycbw-yjQaB3fDoxN4U_D7WMxiAPsrAlT5Urgp8pk8vc-eww2YpMJakiBQNN5l_uI0izA/exec";


const CACHE_KEY =
  "bar13bust_open_challenge";


let lineUserId = "";

let challenges = [];

let statuses = [];


/**
 * キャッシュを保存
 */
function saveCache() {

  try {

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify({
        challenges: challenges,
        statuses: statuses,
        savedAt: Date.now()
      })
    );

  } catch (error) {

    console.log(
      "キャッシュ保存失敗",
      error
    );
  }
}


/**
 * キャッシュを読み込む
 */
function loadCache() {

  try {

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!raw) {
      return false;
    }


    const data =
      JSON.parse(raw);


    if (
      !data ||
      !Array.isArray(data.challenges) ||
      !Array.isArray(data.statuses)
    ) {

      return false;
    }


    challenges =
      data.challenges;


    statuses =
      data.statuses;


    return true;

  } catch (error) {

    console.log(
      "キャッシュ読み込み失敗",
      error
    );

    return false;
  }
}


/**
 * JSONP通信
 */
function jsonp(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement("script");


      const query =
        new URLSearchParams(
          Object.assign(
            {},
            params,
            {
              callback: callbackName
            }
          )
        );


      const url =
        API_URL +
        "?" +
        query.toString();


      let finished = false;


      const timer =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                "通信がタイムアウトしました。"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timer);

        if (script.parentNode) {
          script.parentNode.removeChild(
            script
          );
        }

        delete window[callbackName];
      }


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          resolve(data);
        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error(
              "サーバーとの通信に失敗しました。"
            )
          );
        };


      script.src = url;

      document.body.appendChild(
        script
      );
    }
  );
}


/**
 * 画面を表示
 */
function render() {

  const list =
    document.getElementById(
      "challengeList"
    );


  list.innerHTML = "";


  let completedCount = 0;


  /*
   * チャレンジがまだ取得できていない場合
   */
  if (
    !challenges ||
    challenges.length === 0
  ) {

    return;
  }


  challenges.forEach(
    function(challenge, index) {

      const status =
        statuses[index] || "";


      if (status === "completed") {
        completedCount++;
      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "challenge" +
        (
          status === "completed"
            ? " completed"
            : ""
        );


      let content = "";


      content +=
        '<div class="number">' +
        "CHALLENGE " +
        (index + 1) +
        "</div>";


      content +=
        '<div class="title">' +
        escapeHtml(challenge) +
        "</div>";


      /*
       * 達成済み
       */
      if (status === "completed") {

        content +=
          '<div class="completed-text">' +
          "✓ 達成済み" +
          "</div>";
      }


      /*
       * 確認待ち
       */
      else if (status === "pending") {

        content +=
          '<div class="pending">' +
          "スタッフ確認待ち" +
          "</div>";


        content +=
          '<button ' +
          'onclick="confirmChallenge(' +
          index +
          ')">' +
          "スタッフ：達成済みにする" +
          "</button>";
      }


      /*
       * 未達成
       */
      else {

        content +=
          '<button ' +
          'onclick="requestChallenge(' +
          index +
          ')">' +
          "達成する" +
          "</button>";
      }


      card.innerHTML =
        content;


      list.appendChild(card);
    }
  );


  document.getElementById(
    "progress"
  ).textContent =
    completedCount +
    " / 9 達成";


  document.getElementById(
    "clear"
  ).style.display =
    completedCount === 9
      ? "block"
      : "none";
}


/**
 * 起動時の処理
 */
async function init() {

  /*
   * 最初にキャッシュを表示
   *
   * LINE通信を待たない
   */
  const hasCache =
    loadCache();


  if (hasCache) {

    render();

    document.getElementById(
      "startupText"
    ).textContent =
      "最新情報を確認しています...";

  } else {

    /*
     * 初回利用者
     *
     * チャレンジの仮表示
     */
    challenges = [
      "BAR 13 BUSTに来店",
      "公式LINE友だち登録をする",
      "キープボトルを注文（誰かと一緒に入れるもOK）",
      "スタッフと乾杯（スタッフドリンク1杯）",
      "ショットを注文",
      "ダーツを1回プレイ",
      "スタッフの誰かと写真を撮る",
      "BAR 13 BUSTのInstagramをフォロー",
      "InstagramのストーリーでBAR 13 BUSTをメンションする"
    ];

    statuses = [
      "",
      "",
      "",
      "",
      "",
      "",
      "",
      "",
      ""
    ];


    render();

    document.getElementById(
      "startupText"
    ).textContent =
      "LINEと接続しています...";
  }


  try {

    /*
     * LIFF初期化
     */
    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * 外部ブラウザの場合
     */
    if (!liff.isLoggedIn()) {

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    /*
     * LINEユーザー情報
     */
    const profile =
      await liff.getProfile();


    lineUserId =
      profile.userId;


    /*
     * 最新データ取得
     *
     * ここは画面表示とは別に行う
     */
    const result =
      await jsonp({
        action: "get",
        line_user_id: lineUserId
      });


    if (!result.ok) {

      throw new Error(
        result.error ||
        "データ取得に失敗しました。"
      );
    }


    /*
     * 最新状態に更新
     */
    challenges =
      result.challenges || [];


    statuses =
      result.statuses || [];


    /*
     * 最新状態をキャッシュ
     */
    saveCache();


    /*
     * 最新状態を画面へ反映
     */
    render();


    document.getElementById(
      "startup"
    ).style.display =
      "none";


  } catch (error) {

    console.error(error);


    /*
     * キャッシュがある場合は
     * そのまま使わせる
     */
    if (hasCache) {

      document.getElementById(
        "startupText"
      ).textContent =
        "最新情報を取得できませんでした。";

      /*
       * 既存データはそのまま表示
       */

    } else {

      document.getElementById(
        "startupText"
      ).innerHTML =
        "通信に失敗しました。<br><br>" +
        escapeHtml(
          error.message ||
          String(error)
        );
    }
  }
}


/**
 * お客様が達成申請
 *
 * 画面を先に変更
 */
async function requestChallenge(index) {

  const oldStatus =
    statuses[index] || "";


  if (
    oldStatus === "pending" ||
    oldStatus === "completed"
  ) {

    return;
  }


  /*
   * 即座に画面変更
   */
  statuses[index] =
    "pending";


  render();


  showMessage(
    "この画面をスタッフに見せてください。"
  );


  /*
   * キャッシュも即更新
   */
  saveCache();


  /*
   * 裏側でサーバー保存
   */
  try {

    const result =
      await jsonp({
        action: "request",
        line_user_id: lineUserId,
        challenge_index: index
      });


    if (!result.ok) {

      throw new Error(
        result.error ||
        "保存に失敗しました。"
      );
    }


  } catch (error) {

    /*
     * 保存失敗時だけ元に戻す
     */
    statuses[index] =
      oldStatus;


    saveCache();

    render();


    showMessage(
      "保存に失敗しました。もう一度お試しください。"
    );


    console.error(error);
  }
}


/**
 * スタッフが達成確認
 *
 * 画面を先に変更
 */
async function confirmChallenge(index) {

  const ok =
    window.confirm(
      "このチャレンジを達成済みにしますか？"
    );


  if (!ok) {
    return;
  }


  const oldStatus =
    statuses[index];


  /*
   * 即座にcompleted
   */
  statuses[index] =
    "completed";


  render();


  showMessage(
    "達成しました！"
  );


  /*
   * キャッシュ更新
   */
  saveCache();


  /*
   * 裏側で保存
   */
  try {

    const result =
      await jsonp({
        action: "confirm",
        line_user_id: lineUserId,
        challenge_index: index
      });


    if (!result.ok) {

      throw new Error(
        result.error ||
        "保存に失敗しました。"
      );
    }


  } catch (error) {

    /*
     * 保存失敗時は元に戻す
     */
    statuses[index] =
      oldStatus;


    saveCache();

    render();


    showMessage(
      "保存に失敗しました。もう一度お試しください。"
    );


    console.error(error);
  }
}


/**
 * メッセージ表示
 */
function showMessage(message) {

  document.getElementById(
    "message"
  ).textContent =
    message;
}


/**
 * HTMLエスケープ
 */
function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/*
 * 起動
 */
init();

</script>

</body>
</html>
