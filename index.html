<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BAR 13 BUST Supabase診断</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .status {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #222;
      border: 1px solid #444;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok {
      border-color: #22c55e;
      background: #102818;
    }

    .error {
      border-color: #ef4444;
      background: #301010;
      color: #ffb4b4;
    }

    .waiting {
      border-color: #eab308;
      background: #302900;
      color: #ffe88a;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BAR 13 BUST<br>Supabase診断</h1>

  <div id="step1" class="status waiting">
    ① LIFF初期化待ち...
  </div>

  <div id="step2" class="status waiting">
    ② LINEユーザー情報取得待ち...
  </div>

  <div id="step3" class="status waiting">
    ③ Supabase接続待ち...
  </div>

  <div id="step4" class="status waiting">
    ④ チャレンジ取得待ち...
  </div>

  <div id="result" class="status waiting">
    結果待ち...
  </div>

  <div class="small">
    LIFF ID:<br>
    <span id="liffId"></span>
    <br><br>
    Edge Function:<br>
    <span id="functionUrl"></span>
  </div>

</div>

<script>

const LIFF_ID = "2011914396-ReXZiMYU";

const FUNCTION_URL =
  "https://hbughgnmpvuvxwcfmwd.supabase.co/functions/v1/bar13bust-challenge";

const SUPABASE_KEY =
  "sb_publishable_MNf7N_2NxfNOqkFRxaaX5Q_9KXTpBUg";


const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");
const step4 = document.getElementById("step4");
const result = document.getElementById("result");

document.getElementById("liffId").textContent = LIFF_ID;
document.getElementById("functionUrl").textContent = FUNCTION_URL;


function setOK(element, message) {
  element.className = "status ok";
  element.textContent = message;
}


function setError(element, message) {
  element.className = "status error";
  element.textContent = message;
}


function setWaiting(element, message) {
  element.className = "status waiting";
  element.textContent = message;
}


/* ---------------------------------
   LIFF初期化
--------------------------------- */

async function start() {

  try {

    setWaiting(
      step1,
      "① LIFF初期化中..."
    );

    await liff.init({
      liffId: LIFF_ID
    });

    setOK(
      step1,
      "① LIFF初期化 OK"
    );


    /* ---------------------------------
       LINEユーザー情報
    --------------------------------- */

    setWaiting(
      step2,
      "② LINEユーザー情報取得中..."
    );

    let lineUserId = null;


    try {

      const idToken = liff.getDecodedIDToken();

      if (idToken && idToken.sub) {
        lineUserId = idToken.sub;
      }

    } catch (error) {

      console.log(
        "getDecodedIDToken error:",
        error
      );

    }


    if (!lineUserId) {

      const profile = await liff.getProfile();

      if (profile && profile.userId) {
        lineUserId = profile.userId;
      }

    }


    if (!lineUserId) {

      throw new Error(
        "LINEユーザーIDを取得できませんでした。"
      );

    }


    setOK(
      step2,
      "② LINEユーザー情報取得 OK\n\n" +
      "LINE User ID:\n" +
      lineUserId
    );


    /* ---------------------------------
       Supabase接続
    --------------------------------- */

    setWaiting(
      step3,
      "③ Supabase Edge Functionへ接続中..."
    );


    const requestUrl =
      FUNCTION_URL +
      "?line_user_id=" +
      encodeURIComponent(lineUserId);


    const response = await fetch(
      requestUrl,
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY
        },

        mode: "cors",

        cache: "no-store"
      }
    );


    if (!response.ok) {

      const text = await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        "\n\n" +
        text
      );

    }


    const data = await response.json();


    setOK(
      step3,
      "③ Supabase接続 OK\n\n" +
      "HTTP Status: " +
      response.status
    );


    /* ---------------------------------
       チャレンジ取得
    --------------------------------- */

    setWaiting(
      step4,
      "④ チャレンジデータ確認中..."
    );


    if (
      !data ||
      data.ok !== true ||
      !Array.isArray(data.challenges)
    ) {

      throw new Error(
        "Supabaseから想定したデータが返ってきませんでした。\n\n" +
        JSON.stringify(data, null, 2)
      );

    }


    const challenges = data.challenges;

    const completed = Array.isArray(data.completed)
      ? data.completed
      : [];


    setOK(
      step4,
      "④ チャレンジ取得 OK\n\n" +
      "チャレンジ数: " +
      challenges.length +
      "\n" +
      "達成済み: " +
      completed.length
    );


    /* ---------------------------------
       最終結果
    --------------------------------- */

    let text =
      "⑤ Supabase接続テスト成功！\n\n" +
      "LINE User ID:\n" +
      lineUserId +
      "\n\n" +
      "取得したチャレンジ:\n";


    challenges.forEach(function(challenge) {

      text +=
        challenge.sort_order +
        ". " +
        challenge.title +
        "\n";

    });


    result.className = "status ok";
    result.textContent = text;


  } catch (error) {

    const message =
      error && error.message
        ? error.message
        : String(error);


    result.className = "status error";

    result.textContent =
      "Supabase接続テスト失敗\n\n" +
      message;


    console.error(
      "Supabase diagnostic error:",
      error
    );

  }

}


start();

</script>

</body>
</html>
