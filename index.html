<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BAR 13 BUST SPEED TEST</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    onload="mark('LIFF SDK読み込み完了')"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    .status {
      background: #1d1d1d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .name {
      color: #aaa;
      font-size: 13px;
    }

    .value {
      margin-top: 4px;
      font-size: 17px;
      font-weight: bold;
    }

    .ok {
      color: #35d07f;
    }

    .wait {
      color: #ffd54a;
    }

    .error {
      color: #ff6565;
    }

    .result {
      background: #222;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      line-height: 1.8;
      word-break: break-word;
    }

    .note {
      color: #999;
      font-size: 13px;
      margin-top: 20px;
      line-height: 1.6;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>BAR 13 BUST</h1>

  <div class="subtitle">
    起動速度テスト
  </div>


  <div class="status">

    <div class="row">
      <div class="name">
        ① ページ読み込み
      </div>

      <div
        id="page"
        class="value wait"
      >
        計測中...
      </div>
    </div>


    <div class="row">
      <div class="name">
        ② LIFF SDK
      </div>

      <div
        id="sdk"
        class="value wait"
      >
        待機中...
      </div>
    </div>


    <div class="row">
      <div class="name">
        ③ liff.init()
      </div>

      <div
        id="init"
        class="value wait"
      >
        待機中...
      </div>
    </div>


    <div class="row">
      <div class="name">
        ④ LINEユーザー情報
      </div>

      <div
        id="profile"
        class="value wait"
      >
        待機中...
      </div>
    </div>


    <div class="row">
      <div class="name">
        ⑤ Apps Script通信
      </div>

      <div
        id="api"
        class="value wait"
      >
        待機中...
      </div>
    </div>


    <div class="row">
      <div class="name">
        ⑥ 画面表示
      </div>

      <div
        id="display"
        class="value wait"
      >
        待機中...
      </div>
    </div>

  </div>


  <div
    id="result"
    class="result"
  >
    計測しています...
  </div>


  <div class="note">
    ※この画面は速度確認専用です。<br>
    計測終了後、本番用画面に戻します。
  </div>

</div>


<script>

/*
 * =========================
 * 基本設定
 * =========================
 */

const LIFF_ID =
  "2011914396-ReXZiMYU";


const API_URL =
  "https://script.google.com/macros/s/AKfycbw-yjQaB3fDoxN4U_D7WMxiAPsrAlT5Urgp8pk8vc-eww2YpMJakiBQNN5l_uI0izA/exec";


/*
 * =========================
 * 計測
 * =========================
 */

const startTime =
  performance.now();


const times = {};


function elapsed() {

  return (
    performance.now() -
    startTime
  );
}


function seconds(ms) {

  return (
    ms / 1000
  ).toFixed(2) + "秒";
}


function mark(name) {

  const time =
    elapsed();


  times[name] =
    time;


  console.log(
    name,
    seconds(time)
  );


  /*
   * SDK読み込み完了
   */
  if (
    name ===
    "LIFF SDK読み込み完了"
  ) {

    setStatus(
      "sdk",
      "OK " + seconds(time),
      "ok"
    );
  }
}


/*
 * =========================
 * 表示変更
 * =========================
 */

function setStatus(
  id,
  text,
  className
) {

  const element =
    document.getElementById(id);


  element.textContent =
    text;


  element.className =
    "value " +
    className;
}


/*
 * =========================
 * JSONP
 * =========================
 */

function jsonp(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "speedTest_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          Object.assign(
            {},
            params,
            {
              callback:
                callbackName
            }
          )
        );


      const url =
        API_URL +
        "?" +
        query.toString();


      let finished =
        false;


      const timer =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                "15秒でタイムアウト"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timer);


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );
        }


        delete window[
          callbackName
        ];
      }


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          resolve(data);
        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          reject(
            new Error(
              "通信エラー"
            )
          );
        };


      script.src =
        url;


      document.body.appendChild(
        script
      );

    }
  );
}


/*
 * =========================
 * メイン処理
 * =========================
 */

async function runTest() {

  /*
   * ① ページ読み込み
   */

  setStatus(
    "page",
    "OK " +
    seconds(
      elapsed()
    ),
    "ok"
  );


  /*
   * ③ LIFF init
   */

  setStatus(
    "init",
    "処理中...",
    "wait"
  );


  const initStart =
    performance.now();


  try {

    await liff.init({
      liffId:
        LIFF_ID
    });


    const initTime =
      performance.now() -
      initStart;


    times.liffInit =
      initTime;


    setStatus(
      "init",
      "OK " +
      seconds(initTime),
      "ok"
    );


  } catch (error) {

    setStatus(
      "init",
      "ERROR",
      "error"
    );


    showResult(
      "LIFF初期化でエラーが発生しました。<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      )
    );


    return;
  }


  /*
   * ④ LINEユーザー情報
   */

  const profileStart =
    performance.now();


  try {

    if (
      !liff.isLoggedIn()
    ) {

      setStatus(
        "profile",
        "LINEログインへ移動",
        "wait"
      );


      liff.login({
        redirectUri:
          window.location.href
      });


      return;
    }


    const profile =
      await liff.getProfile();


    const profileTime =
      performance.now() -
      profileStart;


    times.profile =
      profileTime;


    setStatus(
      "profile",
      "OK " +
      seconds(profileTime),
      "ok"
    );


    /*
     * ⑤ Apps Script
     */

    setStatus(
      "api",
      "通信中...",
      "wait"
    );


    const apiStart =
      performance.now();


    const result =
      await jsonp({

        action:
          "get",

        line_user_id:
          profile.userId

      });


    const apiTime =
      performance.now() -
      apiStart;


    times.api =
      apiTime;


    if (
      !result.ok
    ) {

      throw new Error(
        result.error ||
        "APIエラー"
      );
    }


    setStatus(
      "api",
      "OK " +
      seconds(apiTime),
      "ok"
    );


    /*
     * ⑥ 画面表示
     */

    const displayStart =
      performance.now();


    /*
     * 今回はデータを受け取って
     * 表示できるところまで
     */

    document.getElementById(
      "display"
    ).textContent =
      "OK " +
      seconds(
        performance.now() -
        displayStart
      );


    document.getElementById(
      "display"
    ).className =
      "value ok";


    /*
     * 結果
     */

    showResult(

      "<strong>速度計測結果</strong><br><br>" +

      "LIFF初期化：" +
      seconds(
        times.liffInit
      ) +
      "<br>" +

      "LINE情報取得：" +
      seconds(
        times.profile
      ) +
      "<br>" +

      "Apps Script：" +
      seconds(
        times.api
      ) +
      "<br><br>" +

      "<strong>ページ読み込み開始から：" +
      seconds(
        elapsed()
      ) +
      "</strong>"

    );


  } catch (error) {

    setStatus(
      "api",
      "ERROR",
      "error"
    );


    showResult(
      "通信でエラーが発生しました。<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      )
    );
  }

}


/*
 * =========================
 * 結果表示
 * =========================
 */

function showResult(
  html
) {

  document.getElementById(
    "result"
  ).innerHTML =
    html;
}


/*
 * =========================
 * HTMLエスケープ
 * =========================
 */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/*
 * =========================
 * 実行
 * =========================
 */

runTest();

</script>

</body>
</html>
