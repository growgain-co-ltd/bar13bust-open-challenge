<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAR 13 BUST 接続診断</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:24px 16px}
h1{text-align:center;font-size:25px;margin:20px 0 8px}.sub{text-align:center;color:#aaa;margin-bottom:24px}
.box{background:#292929;border-radius:14px;padding:16px;margin:12px 0}.ok{color:#6ee7a8}.ng{color:#ff7777}.wait{color:#ffd166}
.label{font-weight:700;margin-bottom:6px}.detail{font-size:13px;color:#bbb;word-break:break-word;white-space:pre-wrap}
</style>
</head>
<body>
<h1>BAR 13 BUST</h1><div class="sub">接続診断</div>
<div id="status" class="box"><div class="label wait">診断中…</div><div class="detail">接続を確認しています。</div></div>
<div id="steps"></div>
<script>
const LIFF_ID="2011914396-ReXZiMYU";
const FUNCTION_URL="https://hbughgnmpvvuxvwcfmwd.supabase.co/functions/v1/bar13bust-challenge";

const steps=document.getElementById("steps"), status=document.getElementById("status");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function step(name,state,detail=""){const d=document.createElement("div");d.className="box";d.innerHTML=`<div class="label ${state==="OK"?"ok":state==="NG"?"ng":"wait"}">${state==="OK"?"✓":state==="NG"?"✕":"…"} ${name}: ${state}</div><div class="detail">${esc(detail)}</div>`;steps.appendChild(d);}
function fail(e){status.innerHTML=`<div class="label ng">診断エラー</div><div class="detail">${esc(e?.stack||e?.message||String(e))}</div>`;}
function setOK(t,d){status.innerHTML=`<div class="label ok">✓ ${esc(t)}</div><div class="detail">${esc(d)}</div>`;}
async function sdk(){return new Promise((resolve,reject)=>{if(window.liff)return resolve();const s=document.createElement("script");s.src="https://static.line-scdn.net/liff/edge/2/sdk.js";s.onload=resolve;s.onerror=()=>reject(new Error("LINE SDKの読み込みに失敗しました"));document.head.appendChild(s);});}

(async()=>{
try{
step("LINE SDK読み込み","WAIT");await sdk();step("LINE SDK読み込み","OK","window.liff OK");
step("LIFF初期化","WAIT");await liff.init({liffId:LIFF_ID});step("LIFF初期化","OK",LIFF_ID);
step("LINEログイン状態","WAIT");const logged=liff.isLoggedIn();step("LINEログイン状態","OK","isLoggedIn = "+logged);
if(!logged){liff.login({redirectUri:location.href});return;}
step("LINEプロフィール取得","WAIT");const p=await liff.getProfile();step("LINEプロフィール取得","OK","userId取得成功");
step("Edge Function接続","WAIT");
const r=await fetch(FUNCTION_URL,{method:"GET",mode:"cors",cache:"no-store"});
const txt=await r.text();
if(!r.ok)throw new Error("Edge Function HTTP "+r.status+"\n"+txt);
let data;try{data=JSON.parse(txt)}catch{throw new Error("JSONではありません\n"+txt)}
step("Edge Function接続","OK","HTTP "+r.status+" / challenges: "+(data.challenges?.length??"不明")+"件");
setOK("診断完了","Edge Function経由でSupabaseへ接続できました。");
}catch(e){fail(e);step("エラー詳細","NG",e?.stack||e?.message||String(e));}
})();
</script>
</body>
</html>
