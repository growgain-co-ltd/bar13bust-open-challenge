<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BAR 13 BUST OPEN CHALLENGE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    .progress {
      background: #222;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .challenge {
      background: #1d1d1d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }

    .challenge.completed {
      border-color: #35d07f;
      background: #16251d;
    }

    .number {
      font-size: 13px;
      color: #999;
      margin-bottom: 5px;
    }

    .title {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #111;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .pending {
      color: #ffd54a;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .completed-text {
      color: #35d07f;
      font-weight: bold;
      text-align: center;
      padding: 10px 0;
    }

    .message {
      text-align: center;
      margin: 15px 0;
      color: #aaa;
      min-height: 20px;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
    }

    .clear {
      display: none;
      background: #35d07f;
      color: #07140d;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>BAR 13 BUST</h1>

  <div class="subtitle">
    OPEN CHALLENGE
  </div>


  <div
    id="loading"
    class="loading"
  >
    LINEと接続しています...
  </div>


  <div id="app" style="display:none;">

    <div
      id="progress"
      class="progress"
    >
      0 / 9 達成
    </div>


    <div
      id="clear"
      class="clear"
    >
      🎉 9個すべて達成！ 🎉<br><br>
      スタッフに画面を見せてください。
    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div id="challengeList"></div>

  </div>

</div>


<script>

const LIFF_ID =
  "2011914396-ReXZiMYU";


const API_URL =
  "https://script.google.com/macros/s/AKfycbw-yjQaB3fDoxN4U_D7WMxiAPsrAlT5Urgp8pk8vc-eww2YpMJakiBQNN5l_uI0izA/exec";


let lineUserId = "";

let challenges = [];

let statuses = [];


/**
 * JSONP通信
 */
function jsonp(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement("script");


      const query =
        new URLSearchParams(
          Object.assign(
            {},
            params,
            {
              callback: callbackName
            }
          )
        );


      const url =
        API_URL +
        "?" +
        query.toString();


      const timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "通信がタイムアウトしました。"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timer);

        if (script.parentNode) {
          script.parentNode.removeChild(
            script
          );
        }

        delete window[callbackName];
      }


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);
        };


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "サーバーとの通信に失敗しました。"
            )
          );
        };


      script.src = url;

      document.body.appendChild(
        script
      );
    }
  );
}


/**
 * 初期化
 */
async function init() {

  try {

    /*
     * LIFF初期化
     */
    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * 外部ブラウザの場合
     */
    if (!liff.isLoggedIn()) {

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    /*
     * LINEユーザー情報取得
     */
    const profile =
      await liff.getProfile();


    lineUserId =
      profile.userId;


    /*
     * Google Apps Scriptからデータ取得
     */
    const result =
      await jsonp({
        action: "get",
        line_user_id: lineUserId
      });


    if (!result.ok) {

      throw new Error(
        result.error ||
        "データ取得に失敗しました。"
      );
    }


    challenges =
      result.challenges || [];


    statuses =
      result.statuses || [];


    render();


    document.getElementById(
      "loading"
    ).style.display = "none";


    document.getElementById(
      "app"
    ).style.display = "block";


  } catch (error) {

    console.error(error);


    document.getElementById(
      "loading"
    ).innerHTML =
      "エラーが発生しました。<br><br>" +
      escapeHtml(
        error.message ||
        String(error)
      );
  }
}


/**
 * 画面表示
 */
function render() {

  const list =
    document.getElementById(
      "challengeList"
    );


  list.innerHTML = "";


  let completedCount = 0;


  challenges.forEach(
    function(challenge, index) {

      const status =
        statuses[index] || "";


      if (status === "completed") {
        completedCount++;
      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "challenge" +
        (
          status === "completed"
            ? " completed"
            : ""
        );


      let content = "";


      content +=
        '<div class="number">' +
        "CHALLENGE " +
        (index + 1) +
        "</div>";


      content +=
        '<div class="title">' +
        escapeHtml(challenge) +
        "</div>";


      /*
       * 達成済み
       */
      if (status === "completed") {

        content +=
          '<div class="completed-text">' +
          "✓ 達成済み" +
          "</div>";
      }


      /*
       * 確認待ち
       */
      else if (status === "pending") {

        content +=
          '<div class="pending">' +
          "スタッフ確認待ち" +
          "</div>";


        content +=
          '<button ' +
          'onclick="confirmChallenge(' +
          index +
          ')">' +
          "スタッフ：達成済みにする" +
          "</button>";
      }


      /*
       * 未達成
       */
      else {

        content +=
          '<button ' +
          'onclick="requestChallenge(' +
          index +
          ')">' +
          "達成する" +
          "</button>";
      }


      card.innerHTML =
        content;


      list.appendChild(card);
    }
  );


  document.getElementById(
    "progress"
  ).textContent =
    completedCount +
    " / 9 達成";


  if (completedCount === 9) {

    document.getElementById(
      "clear"
    ).style.display =
      "block";
  }

}


/**
 * お客様が達成申請
 */
async function requestChallenge(index) {

  try {

    showMessage(
      "処理しています..."
    );


    const result =
      await jsonp({
        action: "request",
        line_user_id: lineUserId,
        challenge_index: index
      });


    if (!result.ok) {

      throw new Error(
        result.error ||
        "処理に失敗しました。"
      );
    }


    statuses[index] =
      result.status;


    render();


    showMessage(
      "この画面をスタッフに見せてください。"
    );


  } catch (error) {

    showMessage(
      error.message ||
      "エラーが発生しました。"
    );
  }
}


/**
 * スタッフが達成確認
 */
async function confirmChallenge(index) {

  const ok =
    window.confirm(
      "このチャレンジを達成済みにしますか？"
    );


  if (!ok) {
    return;
  }


  try {

    showMessage(
      "達成を登録しています..."
    );


    const result =
      await jsonp({
        action: "confirm",
        line_user_id: lineUserId,
        challenge_index: index
      });


    if (!result.ok) {

      throw new Error(
        result.error ||
        "処理に失敗しました。"
      );
    }


    statuses[index] =
      result.status;


    render();


    showMessage(
      "達成しました！"
    );


  } catch (error) {

    showMessage(
      error.message ||
      "エラーが発生しました。"
    );
  }
}


/**
 * メッセージ表示
 */
function showMessage(message) {

  document.getElementById(
    "message"
  ).textContent =
    message;
}


/**
 * HTMLエスケープ
 */
function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/*
 * 開始
 */
init();

</script>

</body>
</html>
